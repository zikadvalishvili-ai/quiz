<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        /* --- Environment Styles --- */
        .sky-bg {
            background: linear-gradient(180deg, #38BDF8 0%, #BAE6FD 62%, #E0F2FE 100%);
        }

        .dirt-bg {
            background: linear-gradient(180deg, #6D4C41 0%, #4E342E 45%, #3E2723 100%);
            border-top: 14px solid #7CB342;
            border-radius: 36px 36px 0 0;
            box-shadow: inset 0 18px 30px rgba(0,0,0,0.35);
        }

        /* Clouds Animation */
        .cloud {
            position: absolute;
            opacity: 0.85;
            animation: floatCloud linear infinite;
            filter: drop-shadow(0 6px 10px rgba(2, 132, 199, 0.12));
        }
        .cloud-1 { top: 8%; width: 110px; animation-duration: 42s; animation-name: floatCloudRight; }
        .cloud-2 { top: 18%; width: 150px; animation-duration: 55s; animation-name: floatCloudLeft; left: 100%; }
        .cloud-3 { top: 4%; width: 90px; animation-duration: 32s; animation-name: floatCloudRight; animation-delay: -15s; }

        @keyframes floatCloudRight {
            0% { transform: translateX(-160px); }
            100% { transform: translateX(120vw); }
        }
        @keyframes floatCloudLeft {
            0% { transform: translateX(10vw); }
            100% { transform: translateX(-160px); }
        }

        /* --- 3D Buttons --- */
        .btn-3d {
            position: relative;
            transition: all 0.12s ease;
            border-radius: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-3d:active {
            transform: translateY(6px);
        }

        .btn-action {
            background: linear-gradient(180deg, #66BB6A 0%, #43A047 100%);
            color: #ffffff;
            border-bottom: 6px solid #2E7D32;
            box-shadow: 0 10px 20px rgba(102, 187, 106, 0.4);
        }
        .btn-action:active { border-bottom-width: 0px; box-shadow: 0 4px 10px rgba(102, 187, 106, 0.4); }

        /* --- Plant & SVG Animations --- */
        .plant-svg-wrapper {
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.22));
            animation: growBounce 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 50% 62%;
        }

        @keyframes growBounce {
            0% { transform: scale(0.25); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .sway-gentle {
            animation: gentleSway 4.2s ease-in-out infinite;
            transform-origin: 210px 260px;
        }

        @keyframes gentleSway {
            0%, 100% { transform: rotate(-1.2deg); }
            50% { transform: rotate(1.5deg); }
        }

        .part-label {
            animation: fadeSlideIn 0.65s ease-out forwards;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mascot-avatar-img {
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.18));
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        /* Celebration Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s linear forwards;
            z-index: 60;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>

            {
                type: 'choice',
                q: "როგორ უკავშირდება მცენარე მიწას?",
                opts: [{ t: "ფესვებით (მიწის ქვეშ)", c: true }, { t: "🌸 ყვავილით (მიწის ზემოთ)", c: false }]
            },
            {
                type: 'match',
                q: "დააკავშირე: რა იზრდება პირველად და რა ბოლოს?",
                pairs: [
                    { left: "პირველ რიგში", right: "ფესვი, ყლორტი და კვირტი" },
                    { left: "საბოლოოდ", right: "ღერო, ფოთოლი და ყვავილი" }
                ]
            },
            {
                type: 'match',
                q: "დააკავშირე მცენარის ნაწილები ადგილმდებარეობის მიხედვით:",
                pairs: [
                    { left: "მიწის ქვეშ არის", right: "ფესვი" },
                    { left: "მიწის ზემოთ არის", right: "ღერო, ფოთოლი, ყვავილი" }
                ]
            },
            {
                type: 'match',
                q: "დააკავშირე მზისა და წყლის დანიშნულება:",
                pairs: [
                    { left: "☀️ მზე", right: "🌡️ აძლევს სითბოს" },
                    { left: "💧 წყალი", right: "🥤 წყურვილს უკლავს" }
                ]
            },
            {
                type: 'match',
                q: "დააკავშირე მცენარის ნაწილების მუშაობა:",
                pairs: [
                    { left: "ფესვი", right: "💧 მიწიდან წყალს სვამს" },
                    { left: "🌿 ფოთოლი", right: "☀️ მზის სხივებს იჭერს" }
                ]
            }
        ];

        let selectedMatchItem = null;
        let selectedMatchSide = null;
        let currentMatchPairs = 0;
        let matchedCount = 0;

        const quizProgressBadge = document.getElementById('quiz-progress-badge');

        function renderQuestion() {
            if (currentQuizIndex >= questions.length) {
                if (quizProgressBadge) {
                    quizProgressBadge.innerText = `ვიქტორინა დასრულდა! 🏆`;
                }
                showSuccess();
                return;
            }

            if (quizProgressBadge) {
                quizProgressBadge.innerText = `ვიქტორინა: კითხვა ${currentQuizIndex + 1} / ${questions.length}`;
            }
            
            const q = questions[currentQuizIndex];
            document.getElementById('quiz-question').innerText = q.q;
            const optsContainer = document.getElementById('quiz-options');
            optsContainer.innerHTML = '';
            
            if (q.type === 'choice') {
                q.opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "btn-3d bg-white text-purple-700 border-2 border-purple-200 border-bottom-[6px] py-4 px-6 text-xl text-left hover:bg-purple-50";
                    btn.style.borderBottomWidth = '6px';
                    btn.style.borderBottomColor = '#D8B4FE'; 
                    btn.innerText = opt.t;
                    
                    btn.onclick = () => {
                        [...optsContainer.children].forEach(b => b.style.pointerEvents = 'none');
                        
                        if (opt.c) {
                            btn.style.backgroundColor = '#4CAF50';
                            btn.style.color = 'white';
                            btn.style.borderBottomColor = '#2E7D32';
                            shootConfetti(15);
                            setTimeout(() => {
                                currentQuizIndex++;
                                renderQuestion();
                            }, 1500);
                        } else {
                            btn.style.backgroundColor = '#EF5350';
                            btn.style.color = 'white';
                            btn.style.borderBottomColor = '#C62828';
                            btn.style.transform = 'translateX(10px)';
                            setTimeout(() => btn.style.transform = 'translateX(-10px)', 100);
                            setTimeout(() => btn.style.transform = 'translateX(0)', 200);
                            
                            setTimeout(() => {
                                btn.style.backgroundColor = 'white';
                                btn.style.color = '#7e22ce'; 
                                btn.style.borderBottomColor = '#D8B4FE';
                                [...optsContainer.children].forEach(b => b.style.pointerEvents = 'auto');
                            }, 1000);
                        }
                    };
                    optsContainer.appendChild(btn);
                });
            } else if (q.type === 'match') {
                selectedMatchItem = null;
                selectedMatchSide = null;
                matchedCount = 0;
                currentMatchPairs = q.pairs.length;
                
                const matchContainer = document.createElement('div');
                matchContainer.className = "flex justify-between gap-2 md:gap-4 w-full";
                
                const leftCol = document.createElement('div');
                leftCol.className = "flex flex-col gap-3 w-1/2";
                
                const rightCol = document.createElement('div');
                rightCol.className = "flex flex-col gap-3 w-1/2";
                
                const indexedPairs = q.pairs.map((p, idx) => ({ ...p, pairId: idx }));
                const shuffledRights = [...indexedPairs].sort(() => Math.random() - 0.5);
                
                indexedPairs.forEach((pair) => {
                    const leftBtn = document.createElement('button');
                    leftBtn.className = "btn-3d bg-white text-blue-700 border-2 border-blue-200 py-3 px-2 text-[15px] md:text-lg leading-tight h-full hover:bg-blue-50 transition-all";
                    leftBtn.style.borderBottomWidth = '6px';
                    leftBtn.style.borderBottomColor = '#93C5FD';
                    leftBtn.innerText = pair.left;
                    leftBtn.dataset.pairId = pair.pairId;
                    leftBtn.dataset.side = 'left';
                    leftBtn.onclick = () => handleMatchSelect(leftBtn, 'left', pair.pairId);
                    leftCol.appendChild(leftBtn);
                });

                shuffledRights.forEach((pair) => {
                    const rightBtn = document.createElement('button');
                    rightBtn.className = "btn-3d bg-white text-purple-700 border-2 border-purple-200 py-3 px-2 text-[15px] md:text-lg leading-tight h-full hover:bg-purple-50 transition-all";
                    rightBtn.style.borderBottomWidth = '6px';
                    rightBtn.style.borderBottomColor = '#D8B4FE';
                    rightBtn.innerText = pair.right;
                    rightBtn.dataset.pairId = pair.pairId;
                    rightBtn.dataset.side = 'right';
                    rightBtn.onclick = () => handleMatchSelect(rightBtn, 'right', pair.pairId);
                    rightCol.appendChild(rightBtn);
                });

                matchContainer.appendChild(leftCol);
                matchContainer.appendChild(rightCol);
                optsContainer.appendChild(matchContainer);
            }
        }

        function resetMatchBtnStyle(btn) {
            const isLeft = btn.dataset.side === 'left';
            btn.style.backgroundColor = 'white';
            btn.style.color = isLeft ? '#1d4ed8' : '#7e22ce';
            btn.style.borderColor = isLeft ? '#bfdbfe' : '#e9d5ff';
            btn.style.borderBottomColor = isLeft ? '#93C5FD' : '#D8B4FE';
            btn.classList.remove('scale-105');
        }

        function handleMatchSelect(btn, side, pairId) {
            if (btn.dataset.matched === 'true') return;

            if (selectedMatchSide === side) {
                if (selectedMatchItem === btn) {
                    resetMatchBtnStyle(btn);
                    selectedMatchItem = null;
                    selectedMatchSide = null;
                    return;
                }
                if (selectedMatchItem) {
                    resetMatchBtnStyle(selectedMatchItem);
                }
                selectedMatchItem = btn;
                selectedMatchSide = side;
                btn.style.backgroundColor = '#FEF08A';
                btn.style.color = '#92400E';
                btn.style.borderColor = '#FACC15';
                btn.style.borderBottomColor = '#D97706';
                btn.classList.add('scale-105');
                return;
            }

            if (!selectedMatchItem) {
                selectedMatchItem = btn;
                selectedMatchSide = side;
                btn.style.backgroundColor = '#FEF08A';
                btn.style.color = '#92400E';
                btn.style.borderColor = '#FACC15';
                btn.style.borderBottomColor = '#D97706';
                btn.classList.add('scale-105');
                return;
            }

            const firstBtn = selectedMatchItem;
            const secondBtn = btn;
            const firstPairId = Number(firstBtn.dataset.pairId);
            selectedMatchItem = null;
            selectedMatchSide = null;

            if (firstPairId === pairId) {
                [firstBtn, secondBtn].forEach(b => {
                    b.dataset.matched = 'true';
                    b.style.pointerEvents = 'none';
                    b.classList.remove('scale-105');
                    b.style.backgroundColor = '#4CAF50';
                    b.style.color = 'white';
                    b.style.borderColor = '#4CAF50';
                    b.style.borderBottomColor = '#2E7D32';
                });
                matchedCount++;
                shootConfetti(10);

                if (matchedCount >= currentMatchPairs) {
                    setTimeout(() => {
                        currentQuizIndex++;
                        renderQuestion();
                    }, 1300);
                }
            } else {
                [firstBtn, secondBtn].forEach(b => {
                    b.style.pointerEvents = 'none';
                    b.classList.remove('scale-105');
                    b.style.backgroundColor = '#EF5350';
                    b.style.color = 'white';
                    b.style.borderColor = '#EF5350';
                    b.style.borderBottomColor = '#C62828';
                    b.style.transform = 'translateX(8px)';
                    setTimeout(() => b.style.transform = 'translateX(-8px)', 100);
                    setTimeout(() => b.style.transform = 'translateX(0)', 200);
                });

                setTimeout(() => {
                    resetMatchBtnStyle(firstBtn);
                    resetMatchBtnStyle(secondBtn);
                    firstBtn.style.pointerEvents = 'auto';
                    secondBtn.style.pointerEvents = 'auto';
                }, 900);
            }
        }

        function showSuccess() {
            document.getElementById('quiz-ui').classList.add('hidden');
            const successUI = document.getElementById('success-ui');
            successUI.classList.remove('hidden');
            setTimeout(() => {
                successUI.classList.remove('scale-0');
                successUI.classList.add('scale-100');
                shootConfetti(50);
            }, 50);
        }

        function shootConfetti(amount = 20) {
            for (let i = 0; i < amount; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = `${Math.random() * 100}vw`;
                conf.style.top = `-20px`;
                conf.style.backgroundColor = ['#FFCA28', '#4FC3F7', '#66BB6A', '#EF5350', '#AB47BC'][Math.floor(Math.random() * 5)];
                conf.style.animationDuration = `${2 + Math.random() * 2}s`;
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }
        }

        window.onload = renderQuestion;
    </script>
</body>
</html>
